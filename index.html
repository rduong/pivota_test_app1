<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TodoApp</title>
  <!-- Google Fonts: Outfit — weights 300-700, font-display: swap -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    /* ===== CSS Design System — TodoApp ===== */

    /* 1. Custom Properties (Design Tokens) */
    :root {
      /* Color Palette */
      --color-bg:            #FFFFFF;
      --color-surface:       #F8F9FA;
      --color-border:        #E9ECEF;
      --color-primary:       #4361EE;
      --color-primary-hover: #3A56D4;
      --color-accent-admin:  #7B2FBE;
      --color-text:          #212529;
      --color-text-muted:    #6C757D;
      --color-error:         #DC3545;
      --color-success:       #198754;
      --color-completed:     #ADB5BD;

      /* Typography — Outfit loaded via Google Fonts CDN */
      --font-family:    'Outfit', Arial, sans-serif;
      --font-size-h1:   28px;
      --font-size-h2:   20px;
      --font-size-h3:   16px;
      --font-size-body: 15px;
      --font-size-sm:   13px;
      --font-size-btn:  14px;

      /* Spacing Scale (8px base unit) */
      --space-xs:  4px;
      --space-sm:  8px;
      --space-md:  16px;
      --space-lg:  24px;
      --space-xl:  32px;
      --space-2xl: 48px;

      /* Border Radius */
      --radius-sm:   4px;
      --radius-md:   8px;
      --radius-lg:   12px;
      --radius-pill: 999px;
    }

    /* 2. Base Reset */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font-family);
      font-size: var(--font-size-body);
      color: var(--color-text);
      background-color: var(--color-bg);
      min-height: 100vh;
    }

    #app {
      min-height: 100vh;
    }

    /* 3. Auth Page Layout (LOGIN and REGISTER views) */
    .auth-page {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: var(--space-lg);
      background-color: var(--color-surface);
    }

    .app-title {
      font-size: var(--font-size-h1);
      font-weight: 700;
      color: var(--color-primary);
      margin-bottom: var(--space-lg);
      letter-spacing: -0.5px;
    }

    .auth-card {
      background: var(--color-bg);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-lg);
      padding: var(--space-xl);
      width: 100%;
      max-width: 380px;
    }

    /* 4. Form Element Styles */
    .field-group {
      margin-bottom: var(--space-md);
    }

    .field-group label {
      display: block;
      font-size: var(--font-size-sm);
      font-weight: 500;
      color: var(--color-text);
      margin-bottom: var(--space-xs);
    }

    .field-group input[type="text"],
    .field-group input[type="password"] {
      width: 100%;
      padding: var(--space-sm) var(--space-md);
      font-family: var(--font-family);
      font-size: var(--font-size-body);
      color: var(--color-text);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-md);
      outline: none;
      transition: border-color 0.15s;
    }

    .field-group input:focus {
      border-color: var(--color-primary);
    }

    .field-error {
      display: block;
      font-size: var(--font-size-sm);
      color: var(--color-error);
      margin-top: var(--space-xs);
      min-height: 18px;
    }

    /* 5. Button Styles */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: var(--space-sm) var(--space-md);
      font-family: var(--font-family);
      font-size: var(--font-size-btn);
      font-weight: 500;
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      min-height: 44px; /* FR-F0.5: 44px touch target */
      min-width: 44px;
      transition: background-color 0.15s, opacity 0.15s;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--color-primary);
      color: #fff;
      width: 100%;
      margin-top: var(--space-sm);
    }

    .btn-primary:hover {
      background-color: var(--color-primary-hover);
    }

    .btn-primary:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    /* 6. Auth Navigation Link and First-Run Notice */
    .auth-link {
      text-align: center;
      margin-top: var(--space-md);
      font-size: var(--font-size-sm);
      color: var(--color-text-muted);
    }

    .auth-link a {
      color: var(--color-primary);
      text-decoration: none;
      font-weight: 500;
    }

    .auth-link a:hover {
      text-decoration: underline;
    }

    .first-run-notice {
      background-color: #EFF6FF;
      border: 1px solid #BFDBFE;
      border-radius: var(--radius-md);
      padding: var(--space-sm) var(--space-md);
      font-size: var(--font-size-sm);
      color: #1D4ED8;
      margin-bottom: var(--space-lg);
      width: 100%;
      max-width: 380px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- All views rendered here by Router -->
  </div>
  <script>
    // ===== Config namespace — localStorage key constants and defaults =====
    const Config = {
      KEYS: {
        USERS:   'todoapp_users',
        INVITES: 'todoapp_invites',
        SESSION: 'todoapp_session',
        TODOS:   (username) => `todoapp_todos_${username}`,
      },
      DEFAULTS: {
        ADMIN_USERNAME: 'admin',
        ADMIN_PASSWORD: 'admin123',
      }
    };

    // ===== Storage namespace — error-resilient localStorage wrappers =====
    const Storage = {
      get(key, fallback = null) {
        try {
          const raw = localStorage.getItem(key);
          return raw === null ? fallback : JSON.parse(raw);
        } catch (e) {
          console.warn(`[Storage] parse failed for key "${key}"`, e);
          return fallback;
        }
      },
      set(key, value) {
        try {
          localStorage.setItem(key, JSON.stringify(value));
        } catch (e) {
          console.warn(`[Storage] write failed for key "${key}"`, e);
        }
      },
      remove(key) {
        localStorage.removeItem(key);
      }
    };

    // ===== hashPassword — async SHA-256 via SubtleCrypto =====
    async function hashPassword(password) {
      const msgUint8 = new TextEncoder().encode(password);
      const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgUint8);
      // Use Array fallback — Uint8Array.toHex() not available in Safari 14
      const hashArray = Array.from(new Uint8Array(hashBuffer));
      return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
    }

    // ===== generateUUID — crypto.randomUUID() with Safari 14 polyfill =====
    function generateUUID() {
      if (typeof crypto.randomUUID === 'function') {
        return crypto.randomUUID();
      }
      // Polyfill for Safari 14 (randomUUID available in Safari 15.4+)
      return ([1e7]+-1e3+-4e3+-8e3+-1e11).replace(/[018]/g, c =>
        (c ^ crypto.getRandomValues(new Uint8Array(1))[0] & 15 >> c / 4).toString(16)
      );
    }

    // ===== Bootstrap namespace — idempotent first-run admin account seeding =====
    const Bootstrap = {
      async init() {
        // FR-F8.1: Check if users already exist — if so, do nothing (idempotency)
        const users = Storage.get(Config.KEYS.USERS, []);
        if (users.length > 0) {
          return { firstRun: false };
        }

        // FR-F8.2: First run — seed default admin account
        // MUST await hashPassword — it's async (SubtleCrypto returns Promise)
        const passwordHash = await hashPassword(Config.DEFAULTS.ADMIN_PASSWORD);
        const adminUser = {
          username: Config.DEFAULTS.ADMIN_USERNAME,
          passwordHash,            // 64-char hex SHA-256 string
          role: 'admin',
          registeredAt: new Date().toISOString(),
          inviteCode: null
        };
        Storage.set(Config.KEYS.USERS, [adminUser]);

        // FR-F8.3: Signal first-run state so Router can show first-run notice
        return { firstRun: true };
      }
    };

    // ===== UI namespace — render functions and event binding =====
    const UI = {
      // Renders the LOGIN view HTML string
      // context.firstRun (boolean): if true, shows first-run setup notice
      renderLogin(context = {}) {
        const notice = context.firstRun
          ? `<div class="first-run-notice" role="status" aria-live="polite">
               ⓘ First time setup: Login with <strong>admin</strong> / <strong>admin123</strong>
             </div>`
          : '';
        return `
          <main class="auth-page">
            <h1 class="app-title">TodoApp</h1>
            ${notice}
            <div class="auth-card">
              <form id="login-form" novalidate>
                <div class="field-group">
                  <label for="username">Username</label>
                  <input type="text" id="username" name="username"
                         autocomplete="username" maxlength="30" required>
                  <span class="field-error" id="username-error" role="alert" aria-live="assertive"></span>
                </div>
                <div class="field-group">
                  <label for="password">Password</label>
                  <input type="password" id="password" name="password"
                         autocomplete="current-password" required>
                  <span class="field-error" id="password-error" role="alert" aria-live="assertive"></span>
                </div>
                <button type="submit" id="login-btn" class="btn btn-primary">Log In</button>
              </form>
              <p class="auth-link">
                Don't have an account? <a href="#" id="go-register">Register →</a>
              </p>
            </div>
          </main>
        `;
      },

      // Stub for REGISTER view — full implementation in Phase 3
      renderRegister() {
        return `
          <main class="auth-page">
            <h1 class="app-title">TodoApp</h1>
            <div class="auth-card">
              <p style="text-align:center; color: var(--color-text-muted);">Registration coming soon.</p>
              <p class="auth-link"><a href="#" id="go-login">← Back to Login</a></p>
            </div>
          </main>
        `;
      },

      // Stubs for views implemented in later phases
      renderAdminDashboard() {
        return `<main class="auth-page"><h1 class="app-title">Admin Dashboard</h1><p style="color:var(--color-text-muted)">Phase 2+</p></main>`;
      },

      renderUserDashboard() {
        return `<main class="auth-page"><h1 class="app-title">Dashboard</h1><p style="color:var(--color-text-muted)">Phase 2+</p></main>`;
      },

      renderAdminViewUser(context = {}) {
        return `<main class="auth-page"><h1 class="app-title">Admin View User</h1><p style="color:var(--color-text-muted)">Phase 5+</p></main>`;
      },

      // Binds events AFTER Router.render() has called innerHTML assignment
      // IMPORTANT: Always bind AFTER innerHTML — elements don't exist before that
      bindEvents(view, context = {}) {
        if (view === 'LOGIN') {
          const goRegister = document.getElementById('go-register');
          if (goRegister) {
            goRegister.addEventListener('click', (e) => {
              e.preventDefault();
              Router.navigate('REGISTER');
            });
          }
          // Login form submission — placeholder for Phase 2 (Auth)
          const loginForm = document.getElementById('login-form');
          if (loginForm) {
            loginForm.addEventListener('submit', (e) => {
              e.preventDefault();
              // Auth.login() wired in Phase 2
            });
          }
        }

        if (view === 'REGISTER') {
          const goLogin = document.getElementById('go-login');
          if (goLogin) {
            goLogin.addEventListener('click', (e) => {
              e.preventDefault();
              Router.navigate('LOGIN');
            });
          }
        }
      }
    };

    // ===== Router namespace — client-side state machine =====
    const Router = {
      currentView: null,
      currentContext: {},

      navigate(view, context = {}) {
        // Role guard: admin-only views require active admin session
        const session = Storage.get(Config.KEYS.SESSION);
        if (['ADMIN_DASHBOARD', 'ADMIN_VIEW_USER'].includes(view)) {
          if (!session || session.role !== 'admin') {
            this.navigate('USER_DASHBOARD');
            return;
          }
        }
        // Guard: USER_DASHBOARD requires any valid session
        if (view === 'USER_DASHBOARD') {
          if (!session) {
            this.navigate('LOGIN');
            return;
          }
        }
        this.currentView = view;
        this.currentContext = context;
        this.render();
      },

      render() {
        const app = document.getElementById('app');
        if (!app) return;
        switch (this.currentView) {
          case 'LOGIN':
            app.innerHTML = UI.renderLogin(this.currentContext);
            break;
          case 'REGISTER':
            app.innerHTML = UI.renderRegister();
            break;
          case 'ADMIN_DASHBOARD':
            app.innerHTML = UI.renderAdminDashboard();
            break;
          case 'USER_DASHBOARD':
            app.innerHTML = UI.renderUserDashboard();
            break;
          case 'ADMIN_VIEW_USER':
            app.innerHTML = UI.renderAdminViewUser(this.currentContext);
            break;
          default:
            app.innerHTML = UI.renderLogin({});
        }
        // ALWAYS bind events AFTER innerHTML assignment — elements exist only after this point
        UI.bindEvents(this.currentView, this.currentContext);
      },

      start(firstRun = false) {
        const session = Storage.get(Config.KEYS.SESSION);
        if (!session) {
          this.navigate('LOGIN', { firstRun });
        } else if (session.role === 'admin') {
          this.navigate('ADMIN_DASHBOARD');
        } else {
          this.navigate('USER_DASHBOARD');
        }
      }
    };

    // ===== Async entry point =====
    document.addEventListener('DOMContentLoaded', async () => {
      // Guard: SubtleCrypto requires secure context (file:// or HTTPS)
      // Plain http:// will NOT work — inform the user gracefully
      if (!window.crypto || !window.crypto.subtle) {
        document.getElementById('app').innerHTML = `
          <main class="auth-page">
            <div class="auth-card" style="text-align:center">
              <p style="color:var(--color-error); font-weight:500; margin-bottom:var(--space-md)">
                ⚠️ Secure context required
              </p>
              <p style="color:var(--color-text-muted); font-size:var(--font-size-sm)">
                This app requires HTTPS or a local file (file://) to work correctly.
                Please open index.html directly from your file system.
              </p>
            </div>
          </main>
        `;
        return;
      }

      // Bootstrap: seed admin on first run, get firstRun flag
      const { firstRun } = await Bootstrap.init();

      // Start router: reads session, routes to appropriate view
      // Passes firstRun flag so LOGIN view can show first-run notice (FR-F8.3)
      Router.start(firstRun);
    });
  </script>
</body>
</html>
